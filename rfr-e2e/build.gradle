plugins {
    id 'io.qameta.allure' version '4.3.0'
}

group = 'io.student'
version = '1.0.0'

def allureJavaVersion = '3.0.0'
def allureReportVersion = '3.17.0'
def aspectJVersion = '1.9.25.1'
def flywayVersion = rootProject.project(':rfr-api').flywayVersion
def junitVersion = '6.1.3'
def playwrightVersion = '1.63.0'
def dataFakerVersion = '2.7.0'

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation platform("io.qameta.allure:allure-bom:$allureJavaVersion")
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:4.1.1")

    testImplementation "io.qameta.allure:allure-jupiter"
    testImplementation "io.qameta.allure:allure-playwright"
    testImplementation "com.microsoft.playwright:playwright:$playwrightVersion"
    testImplementation "net.datafaker:datafaker:$dataFakerVersion"

    testImplementation "org.springframework:spring-jdbc"
    testImplementation "org.springframework.security:spring-security-crypto"
    testImplementation "org.flywaydb:flyway-core:$flywayVersion"
    testRuntimeOnly "org.flywaydb:flyway-mysql:$flywayVersion"
    testImplementation "com.zaxxer:HikariCP"
    testRuntimeOnly "com.mysql:mysql-connector-j"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-testkit"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.aspectj:aspectjrt:$aspectJVersion"
}

allure {
    version = allureReportVersion
    adapter {
        autoconfigure.set(false)
    }
    report {
        configFile = file('allurerc.mjs')
    }
}

// Allure 3 does not overwrite a report directory that already exists, so the report would show the first run for ever
tasks.matching { it.name in ['allureReport', 'allureServe'] }.configureEach {
    doFirst {
        delete layout.buildDirectory.dir("reports/allure-report/${name}")
    }
}

def commit = {
    try {
        providers.exec {
            commandLine 'git', 'rev-parse', '--short', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim() ?: 'unknown'
    } catch (Exception ignored) {
        'unknown'
    }
}()

tasks.withType(Test).configureEach {
    systemProperty 'rfr.commit', commit
    systemProperty 'rfr.authMigrations', rootProject.file('rfr-auth/src/main/resources/db/migration/rangiffler-auth').absolutePath
    systemProperty 'rfr.apiMigrations', rootProject.file('rfr-api/src/main/resources/db/migration/rangiffler-api').absolutePath
    systemProperties System.getProperties().findAll { key, value -> key.toString().startsWith('rfr.') }
    // browsers are installed beforehand (npx playwright install chromium); skip Playwright's auto-download of all of them
    environment 'PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD', '1'
    jvmArgumentProviders.add({ ["-javaagent:${configurations.agent.singleFile}"] } as CommandLineArgumentProvider)
    outputs.upToDateWhen { false }
    // results of earlier runs would be merged into one report as retries of the same tests
    doFirst {
        delete layout.buildDirectory.dir('allure-results')
    }
    // a class-level failure such as the stand wait is only a bare FAILED line without this
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
        showStackTraces = false
        showCauses = true
    }
}

test {
    failOnNoDiscoveredTests = false
    useJUnitPlatform {
        excludeTags 'probe'
    }
    doFirst {
        if (filter.commandLineIncludePatterns.empty) {
            options { excludeTags 'ui' }
        }
    }
}

tasks.register('e2e', Test) {
    group = 'verification'
    description = 'Runs UI tests against a running stand'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'rfr.migrationCheck', 'true'
    useJUnitPlatform {
        includeTags 'ui'
        excludeTags 'probe'
    }
}

tasks.register('installPlaywright', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', 'chromium'
}

tasks.register('showTrace', JavaExec) {
    description = 'Opens trace.zip in the Playwright Trace Viewer: -Ptrace=<path to trace.zip>'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    doFirst {
        if (!project.hasProperty('trace')) {
            throw new GradleException('Pass the file: ./gradlew :rfr-e2e:showTrace -Ptrace=<path to trace.zip>')
        }
        args 'show-trace', file(project.property('trace')).absolutePath
    }
}

tasks.register('installPlaywrightWithDeps', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', '--with-deps', 'chromium'
}
