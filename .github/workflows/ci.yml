name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      shared: ${{ steps.filter.outputs.shared }}
      auth: ${{ steps.filter.outputs.auth }}
      api: ${{ steps.filter.outputs.api }}
      e2e: ${{ steps.filter.outputs.e2e }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/ci.yml'
            shared:
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - 'gradlew.bat'
            auth:
              - 'rfr-auth/**'
            api:
              - 'rfr-api/**'
            e2e:
              - 'rfr-e2e/**'
            frontend:
              - 'rfr-gql-client/**'

  backend:
    needs: changes
    if: >-
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build rfr-auth
        if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.auth == 'true'
        run: ./gradlew :rfr-auth:build
      - name: Build rfr-api
        if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.api == 'true'
        run: ./gradlew :rfr-api:build
      - name: Compile rfr-e2e tests without running them
        if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.e2e == 'true'
        run: ./gradlew :rfr-e2e:compileTestJava

  frontend:
    needs: changes
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: changes
    if: >-
      needs.changes.outputs.ci == 'true' ||
      needs.changes.outputs.shared == 'true' ||
      needs.changes.outputs.auth == 'true' ||
      needs.changes.outputs.api == 'true' ||
      needs.changes.outputs.e2e == 'true' ||
      needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -psecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - name: Install Chromium with system dependencies
        run: ./gradlew :rfr-e2e:installPlaywrightWithDeps
      - name: Start backends in the background
        run: nohup ./gradlew runAll > backends.log 2>&1 &
      - name: Start frontend in the background
        working-directory: rfr-gql-client
        run: |
          npm ci
          nohup npm run dev > ../front.log 2>&1 &
      - name: Create the static users once the backends have migrated the schemas
        env:
          MYSQL_PWD: secret
        run: |
          deadline=$(( $(date +%s) + 240 ))
          until [ -n "$(mysql -h 127.0.0.1 -uroot -N -e 'select count(*) from `rangiffler-auth`.`authority`' 2>/dev/null)" ] \
            && [ -n "$(mysql -h 127.0.0.1 -uroot -N -e 'select id from `rangiffler-api`.`country` where code = "ru"' 2>/dev/null)" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "The schemas were not migrated in 240 s" >&2
              exit 1
            fi
            sleep 2
          done
          mysql -h 127.0.0.1 -uroot < scripts/static-users.sql
      - name: Wait for the stand and run UI tests
        env:
          RFR_STAND_TIMEOUT: 240
        run: ./gradlew :rfr-e2e:e2e
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: rfr-e2e/build/allure-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: service-logs
          path: |
            backends.log
            front.log
          if-no-files-found: ignore
          retention-days: 7
